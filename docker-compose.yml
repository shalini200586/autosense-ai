services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autosense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autosense}
      POSTGRES_DB: autosense
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autosense"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://autosense:${POSTGRES_PASSWORD:-autosense}@db:5432/autosense
      REDIS_URL: redis://redis:6379/0
      # Inside Docker, "localhost" is the container itself, so Ollama on the host is reached via host.docker.internal.
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      CORS_ORIGINS: http://localhost:8090,http://127.0.0.1:8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8090:80"

volumes:
  pgdata:
